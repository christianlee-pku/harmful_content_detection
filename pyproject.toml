[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmful_content_detection"
version = "0.1.0"
description = "Multimodal Harmful Content Detection Pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "SpecFit Agent", email = "agent@specfit.ai"}
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "boto3>=1.26.0",
    "onnxruntime>=1.15.0",
    "numpy",
    "Pillow",
    "tqdm",
    "pyyaml",
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "B", "I"]
ignore = []

